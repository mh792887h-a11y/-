name: Android CI/CD Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Ensure debug keystore exists
        run: |
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || base64 -di debug.keystore.base64 > debug.keystore 2>/dev/null || true
          fi
          if [ ! -f debug.keystore ] || [ ! -s debug.keystore ]; then
            echo "Generating fallback debug.keystore using keytool..."
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp -f debug.keystore app/debug.keystore 2>/dev/null || true

      - name: Create default dummy .env if not exists
        run: |
          if [ ! -f .env ]; then
            touch .env
          fi

      - name: Ensure google-services.json exists
        run: |
          if [ ! -f app/google-services.json ]; then
            echo '{"project_info":{"project_number":"123456789012","project_id":"civil-fund-app","storage_bucket":"civil-fund-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef0123456789abcdef","android_client_info":{"package_name":"com.aistudio.civilfund.ydmxpq"}},"oauth_client":[],"api_key":[{"current_key":"fake_key"}],"services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=512m"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: civil-fund-debug-apk
          path: app/build/outputs/apk/debug/*.apk
